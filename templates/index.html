<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROR</title>

<script src="https://s3.tradingview.com/tv.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui;}
body{background:#000;color:#fff;height:100vh;overflow:hidden;}

/* LOGO */
.logo{
position:fixed;
top:50%;left:50%;
transform:translate(-50%,-50%);
width:180px;
opacity:1;transition:.4s;z-index:-1;
}

/* CHAT */
.chat{
position:absolute;
top:0;left:0;right:0;bottom:200px;
overflow-y:auto;
padding:20px;
display:flex;flex-direction:column;
}

.bubble{
max-width:75%;
padding:12px;
border-radius:18px;
margin-bottom:5px;
font-size:14px;
}

.user{align-self:flex-end;background:#1c1c1c;}
.bot{align-self:flex-start;background:#2a2a2a;}

/* TRADING */
#trading-box{
display:none;
position:absolute;
top:0;left:0;right:0;bottom:200px;
padding:15px;
overflow-y:auto;
}

button{
padding:10px;
border:none;
border-radius:10px;
background:#ff0030;
color:white;
margin:5px;
}

/* MIC */
.mic-panel{
position:fixed;
bottom:90px;
left:50%;
transform:translateX(-50%);
}
.mic{
width:70px;height:70px;border-radius:50%;
background:radial-gradient(circle,#ff0030,#800000);
display:flex;align-items:center;justify-content:center;
box-shadow:0 0 20px red;
cursor:pointer;
}

/* KEYBOARD */
.keyboard{
position:fixed;bottom:0;width:100%;
background:#111;padding:10px;
display:none;gap:5px;
}
input{
flex:1;padding:10px;
border:none;border-radius:20px;
background:#222;color:white;
}
.send{background:#ff0030;border-radius:20px;padding:10px;}

/* TOGGLE */
.toggle-tab{
position:fixed;top:20px;right:0;
width:10px;height:40px;background:#ff0030;
}
.toggle-drawer{
position:fixed;top:20px;right:-120px;
width:120px;height:40px;background:#111;
display:flex;justify-content:space-around;align-items:center;
transition:.3s;
}
.toggle-drawer.open{right:0;}

/* FLOATING */
#fab{position:fixed;bottom:160px;right:20px;z-index:999;}
#fab-main{
width:60px;height:60px;background:#ff0030;border-radius:50%;
display:flex;align-items:center;justify-content:center;
box-shadow:0 0 15px red;cursor:pointer;
}
.fab-option{
width:50px;height:50px;background:#111;border-radius:50%;
display:flex;align-items:center;justify-content:center;
position:absolute;right:5px;
opacity:0;transform:scale(0);
transition:.3s;
}
#fab.open .fab-option:nth-child(2){bottom:70px;opacity:1;transform:scale(1);}
#fab.open .fab-option:nth-child(3){bottom:130px;opacity:1;transform:scale(1);}
#fab.open .fab-option:nth-child(4){bottom:190px;opacity:1;transform:scale(1);}
</style>
</head>

<body>

<img src="{{ url_for('static', filename='ror-logo.png') }}" class="logo" id="logo">

<!-- TOGGLE -->
<div class="toggle-tab" id="toggleTab"></div>
<div class="toggle-drawer" id="toggleDrawer">
<button onclick="setMicMode()">🎤</button>
<button onclick="setKeyboardMode()">⌨️</button>
</div>

<!-- CHAT -->
<div class="chat" id="chat"></div>

<!-- TRADING -->
<div id="trading-box">
<h2>📊 Trading Dashboard</h2>

<button onclick="setSymbol('BTCUSDT')">BTC</button>
<button onclick="setSymbol('ETHUSDT')">ETH</button>
<button onclick="setSymbol('SOLUSDT')">SOL</button>
<button onclick="setSymbol('AAPL')">AAPL</button>

<div id="chart" style="height:300px;"></div>

<button onclick="getTrade()">Check Market</button>

<div id="trade-result"></div>
</div>

<!-- MIC -->
<div class="mic-panel" id="micPanel">
<div class="mic" id="micBtn">🎤</div>
</div>

<!-- KEYBOARD -->
<div class="keyboard" id="keyboard">
<input type="text" id="input">
<button class="send" onclick="sendMessage()">Send</button>
</div>

<!-- FLOAT -->
<div id="fab">
<div id="fab-main">⚙️</div>
<div class="fab-option" onclick="switchMode('chat')">💬</div>
<div class="fab-option" onclick="switchMode('trade')">📊</div>
<div class="fab-option" onclick="switchMode('music')">🎵</div>
</div>

<script>
const chat=document.getElementById("chat");
const logo=document.getElementById("logo");
const micBtn=document.getElementById("micBtn");
const input=document.getElementById("input");

const toggleTab=document.getElementById("toggleTab");
const toggleDrawer=document.getElementById("toggleDrawer");

const micPanel=document.getElementById("micPanel");
const keyboard=document.getElementById("keyboard");

const trading=document.getElementById("trading-box");
const tradeResult=document.getElementById("trade-result");

/* TOGGLE */
toggleTab.onclick=()=>toggleDrawer.classList.toggle("open");

function setMicMode(){
micPanel.style.display="flex";
keyboard.style.display="none";
}

function setKeyboardMode(){
micPanel.style.display="none";
keyboard.style.display="flex";
}

/* CHAT */
function addMessage(text,type){
const div=document.createElement("div");
div.className="bubble "+type;
div.innerText=text;
chat.appendChild(div);
chat.scrollTop=chat.scrollHeight;
logo.style.opacity=0;
}

async function sendMessage(){
if(!input.value.trim())return;

addMessage(input.value,"user");

const res=await fetch("/chat",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({message:input.value})
});

const data=await res.json();
addMessage(data.reply,"bot");
input.value="";
}

/* MIC */
micBtn.onclick=()=>{
if(!('webkitSpeechRecognition'in window))return;

const r=new webkitSpeechRecognition();
r.lang="en-IN";
r.start();

r.onresult=(e)=>{
const text=e.results[0][0].transcript;
addMessage(text,"user");
sendVoice(text);
};
};

function sendVoice(text){
fetch("/chat",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({message:text})
})
.then(r=>r.json())
.then(d=>addMessage(d.reply,"bot"));
}

/* FLOAT SWITCH */
const fab=document.getElementById("fab");
document.getElementById("fab-main").onclick=()=>fab.classList.toggle("open");

function switchMode(mode){
if(mode==="chat"){
chat.style.display="flex";
trading.style.display="none";
}
if(mode==="trade"){
chat.style.display="none";
trading.style.display="block";
}
if(mode==="music"){
alert("Coming soon");
}
fab.classList.remove("open");
}

/* TRADING */
let currentSymbol="BTCUSDT";

function loadChart(symbol){
document.getElementById("chart").innerHTML="";
let tv="BINANCE:"+symbol;
if(symbol==="AAPL") tv="NASDAQ:AAPL";

new TradingView.widget({
container_id:"chart",
autosize:true,
symbol:tv,
interval:"5",
theme:"dark",
hide_top_toolbar:true
});
}

function setSymbol(s){
currentSymbol=s;
loadChart(s);
}

async function getTrade(){
tradeResult.innerText="Loading...";

const res=await fetch("/ror-trade?symbol="+currentSymbol);
const data=await res.json();

tradeResult.innerText=
"Price: "+data.price+
"\nDecision: "+data.analysis.decision+
"\nConfidence: "+data.analysis.confidence+
"\nEntry: "+data.analysis.entry+
"\nTP: "+data.analysis.tp+
"\nSL: "+data.analysis.sl+
"\nReason: "+data.analysis.reason;
}

window.onload=()=>loadChart(currentSymbol);
</script>

</body>
</html>
