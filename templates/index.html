<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROR</title>

<link rel="stylesheet" href="/static/style.css">

<style>
/* FLOAT BUTTON */
.float-btn{
  position:fixed;
  bottom:90px;
  right:20px;
  width:60px;
  height:60px;
  border-radius:50%;
  background:#ff0033;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  color:white;
  box-shadow:0 0 20px red;
  z-index:999;
}
</style>
</head>

<body>

<!-- LOGO -->
<img src="{{ url_for('static', filename='ror-logo.png') }}" class="logo" id="logo">

<!-- TOGGLE -->
<div class="toggle-tab" id="toggleTab"></div>

<div class="toggle-drawer" id="toggleDrawer">
  <button onclick="setMicMode()">🎤</button>
  <button onclick="setKeyboardMode()">⌨️</button>
</div>

<!-- CHAT -->
<div class="chat" id="chat"></div>

<!-- MIC PANEL -->
<div class="mic-panel" id="micPanel">
  <canvas id="blobCanvas"></canvas>
  <div class="mic" id="micBtn">🎤</div>
</div>

<!-- KEYBOARD -->
<div class="keyboard" id="keyboard">
  <input type="text" id="input">
  <button onclick="sendMessage()">Send</button>
</div>

<!-- FLOAT SWITCH -->
<div class="float-btn" onclick="toggleUI()">⚙️</div>

<script>
const chat=document.getElementById("chat");
const input=document.getElementById("input");
const micBtn=document.getElementById("micBtn");
const micPanel=document.getElementById("micPanel");
const keyboard=document.getElementById("keyboard");
const toggleTab=document.getElementById("toggleTab");
const toggleDrawer=document.getElementById("toggleDrawer");

let listening=false;
let t=0;

/* TOGGLE */
toggleTab.onclick=()=>toggleDrawer.classList.toggle("open");

function setMicMode(){
  micPanel.style.display="flex";
  keyboard.style.display="none";
  toggleDrawer.classList.remove("open");
}

function setKeyboardMode(){
  micPanel.style.display="none";
  keyboard.style.display="flex";
  toggleDrawer.classList.remove("open");
}

/* DEFAULT */
setMicMode();

/* CHAT */
function addMessage(text,type){
  const div=document.createElement("div");
  div.className="bubble "+type;
  div.innerText=text;
  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;
}

async function sendMessage(){
  if(!input.value.trim()) return;

  addMessage(input.value,"user");

  const res=await fetch("/chat",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({message:input.value})
  });

  const data=await res.json();
  addMessage(data.reply,"bot");
  input.value="";
}

/* MIC */
micBtn.onclick=()=>{
  if(!('webkitSpeechRecognition' in window)) return;

  const rec=new webkitSpeechRecognition();
  rec.start();
  listening=true;

  rec.onresult=(e)=>{
    const text=e.results[0][0].transcript;
    addMessage(text,"user");
    sendVoice(text);
  }

  rec.onend=()=>listening=false;
}

function sendVoice(text){
  fetch("/chat",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({message:text})
  })
  .then(res=>res.json())
  .then(d=>addMessage(d.reply,"bot"));
}

/* BLOB ANIMATION */
const canvas=document.getElementById("blobCanvas");
const ctx=canvas.getContext("2d");

canvas.width=160;
canvas.height=160;

function drawBlob(){
  ctx.clearRect(0,0,160,160);
  ctx.fillStyle="rgba(255,0,0,0.4)";
  ctx.beginPath();

  for(let i=0;i<360;i++){
    let angle=i*Math.PI/180;
    let r=60+8*Math.sin(angle*2+t)+5*Math.sin(angle*3+t);

    let x=80+r*Math.cos(angle);
    let y=80+r*Math.sin(angle);

    if(i===0) ctx.moveTo(x,y);
    else ctx.lineTo(x,y);
  }

  ctx.closePath();
  ctx.fill();

  t+=0.05;
  requestAnimationFrame(drawBlob);
}

drawBlob();

/* FLOAT UI SWITCH */
function toggleUI(){
  if(micPanel.style.display==="none"){
    setMicMode();
  }else{
    setKeyboardMode();
  }
}
</script>

</body>
</html>
