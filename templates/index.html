<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROR</title>

<style>
body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:system-ui;
}

/* CHAT */
.chat{
  height:60vh;
  overflow-y:auto;
  padding:15px;
}

.bubble{
  padding:10px;
  border-radius:12px;
  margin:6px 0;
  max-width:70%;
}

.user{background:#1a1a1a; align-self:flex-end;}
.bot{background:#2a2a2a; align-self:flex-start;}

/* INPUT */
.input-box{
  position:fixed;
  bottom:0;
  width:100%;
  display:flex;
  gap:5px;
  background:#111;
  padding:10px;
}

input{
  flex:1;
  padding:10px;
  border-radius:20px;
  border:none;
  background:#222;
  color:#fff;
}

button{
  padding:10px;
  border:none;
  border-radius:20px;
  background:#ff004c;
  color:white;
}

/* TRADING DASHBOARD */
#trade-box{
  padding:15px;
}

.card{
  background:rgba(255,255,255,0.05);
  padding:15px;
  border-radius:15px;
  box-shadow:0 0 20px rgba(255,0,80,0.2);
}

.price{
  font-size:24px;
  margin:10px 0;
}

.decision{
  padding:6px;
  text-align:center;
  border-radius:8px;
  margin-bottom:10px;
}

.BUY{background:#00ff8830;}
.SELL{background:#ff003030;}
.HOLD{background:#88888830;}

.levels{
  display:flex;
  justify-content:space-between;
  font-size:12px;
}

.signals{
  font-size:11px;
  opacity:0.7;
  margin-top:10px;
}
</style>
</head>

<body>

<!-- CHAT -->
<div class="chat" id="chat"></div>

<!-- TRADING -->
<div id="trade-box">
  <button onclick="setAsset('bitcoin')">BTC</button>
  <button onclick="setAsset('ethereum')">ETH</button>
  <button onclick="setAsset('solana')">SOL</button>
  <button onclick="setAsset('AAPL')">AAPL</button>

  <button onclick="getTrade()">📊 Check Market</button>

  <div id="trade-result"></div>
</div>

<!-- UPSTOX -->
<div style="padding:10px;">
  <button onclick="connectUpstox()">Connect Upstox</button>
  <button onclick="getFunds()">Funds</button>
  <button onclick="getPositions()">Positions</button>
</div>

<!-- INPUT -->
<div class="input-box">
  <input id="input" placeholder="Talk to ROR">
  <button onclick="sendMessage()">Send</button>
</div>

<script>

// ================= CHAT =================
const chat = document.getElementById("chat");

function addMessage(text,type){
  const div = document.createElement("div");
  div.className = "bubble " + type;
  div.innerText = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function sendMessage(){
  const input = document.getElementById("input");
  if(!input.value) return;

  addMessage(input.value,"user");

  const res = await fetch("/chat",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({message:input.value})
  });

  const data = await res.json();
  addMessage(data.reply,"bot");

  input.value="";
}

// ================= TRADING =================
let currentAsset = "bitcoin";

function setAsset(asset){
  currentAsset = asset;
}

async function getTrade(){

  const box = document.getElementById("trade-result");
  box.innerHTML = "Loading...";

  try{
    const res = await fetch(`/ror-trade/${currentAsset}`);
    const data = await res.json();

    const a = data.analysis;

    box.innerHTML = `
<div class="card">

<div>Session: ${a.session}</div>

<div class="price">$${data.price}</div>

<div class="decision ${a.decision}">
${a.decision}
</div>

<div>Confidence: ${a.confidence}%</div>

<div class="levels">
  <div>Entry: ${a.entry}</div>
  <div>TP: ${a.tp}</div>
  <div>SL: ${a.sl}</div>
</div>

<div class="signals">
${a.signals.join(" • ")}
</div>

<div>${a.reason}</div>

</div>
    `;

  }catch(e){
    box.innerHTML = "Error loading data";
  }
}

// ================= UPSTOX =================
function connectUpstox(){
  window.location.href = "/upstox-login";
}

async function getFunds(){
  const res = await fetch("/upstox-funds");
  const data = await res.json();
  alert(JSON.stringify(data,null,2));
}

async function getPositions(){
  const res = await fetch("/upstox-positions");
  const data = await res.json();
  alert(JSON.stringify(data,null,2));
}

</script>

</body>
    </html>
