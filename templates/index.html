<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROR Pro</title>

<style>
body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:system-ui;
}

/* CARD */
.card{
  background:#111;
  margin:10px;
  padding:15px;
  border-radius:12px;
}

/* BUTTON */
button{
  background:#ff004c;
  border:none;
  color:#fff;
  padding:8px 12px;
  border-radius:8px;
  margin:3px;
}

/* DECISION */
.BUY{background:#00ff8840;}
.SELL{background:#ff003040;}
.HOLD{background:#88888840;}

.price{font-size:24px;}
</style>
</head>

<body>

<h3 style="padding:10px;">ROR Trading</h3>

<!-- ASSETS -->
<div style="padding:10px;">
<button onclick="setAsset('bitcoin')">BTC</button>
<button onclick="setAsset('ethereum')">ETH</button>
<button onclick="setAsset('solana')">SOL</button>
<button onclick="setAsset('AAPL')">AAPL</button>
</div>

<!-- TRADE -->
<div class="card" id="trade"></div>

<!-- ACTION -->
<div style="padding:10px;">
<button onclick="getTrade()">Check Market</button>
<button onclick="confirmTrade()">Confirm Trade</button>
</div>

<!-- UPSTOX -->
<div style="padding:10px;">
<button onclick="connectUpstox()">Connect Upstox</button>
<button onclick="loadPortfolio()">Portfolio</button>
</div>

<!-- PORTFOLIO -->
<div class="card" id="portfolio"></div>

<script>

let currentAsset = "bitcoin";
let latestSignal = null;

// -------- SET ASSET --------
function setAsset(a){
  currentAsset = a;
}

// -------- FETCH TRADE --------
async function getTrade(){
  const res = await fetch(`/ror-trade/${currentAsset}`);
  const data = await res.json();

  const a = data.analysis;
  latestSignal = a;

  document.getElementById("trade").innerHTML = `
<div>Price: $${data.price}</div>
<div class="${a.decision}">${a.decision}</div>
<div>Confidence: ${a.confidence}%</div>

<div>Entry: ${a.entry}</div>
<div>TP: ${a.tp}</div>
<div>SL: ${a.sl}</div>

<div>${a.signals.join(", ")}</div>
<div>${a.reason}</div>
  `;
}

// -------- CONFIRM TRADE --------
async function confirmTrade(){

  if(!latestSignal){
    alert("No signal");
    return;
  }

  if(!confirm(`Execute ${latestSignal.decision}?`)) return;

  const res = await fetch("/execute-order",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      qty:1,
      price:latestSignal.entry,
      type:latestSignal.decision,
      instrument:"NSE_EQ|INE002A01018" // sample token (replace later)
    })
  });

  const data = await res.json();
  alert("Order Response: " + JSON.stringify(data));
}

// -------- PORTFOLIO --------
async function loadPortfolio(){
  const res = await fetch("/portfolio");
  const data = await res.json();

  document.getElementById("portfolio").innerHTML =
    JSON.stringify(data,null,2);
}

// -------- UPSTOX --------
function connectUpstox(){
  window.location.href = "/upstox-login";
}

</script>

</body>
</html>
