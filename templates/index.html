<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROR</title>

<script src="https://s3.tradingview.com/tv.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui;}
body{background:#000;color:#fff;height:100vh;overflow:hidden;}

.chat{
position:absolute;
top:0;left:0;right:0;bottom:200px;
overflow-y:auto;
padding:20px;
display:flex;
flex-direction:column;
}

.bubble{
max-width:75%;
padding:12px;
border-radius:18px;
margin-bottom:5px;
font-size:14px;
}

.user{align-self:flex-end;background:#1c1c1c;}
.bot{align-self:flex-start;background:#2a2a2a;}

#trading-box{
display:none;
position:absolute;
top:0;left:0;right:0;bottom:200px;
padding:15px;
overflow-y:auto;
}

button{
padding:10px;
border:none;
border-radius:10px;
background:#ff0030;
color:white;
margin:5px;
}

.mic-panel{
position:fixed;
bottom:90px;
left:50%;
transform:translateX(-50%);
}

.mic{
width:70px;height:70px;border-radius:50%;
background:radial-gradient(circle,#ff0030,#800000);
display:flex;align-items:center;justify-content:center;
box-shadow:0 0 20px red;
cursor:pointer;
}

.keyboard{
position:fixed;bottom:0;width:100%;
background:#111;padding:10px;
display:none;gap:5px;
}

input{
flex:1;padding:10px;border:none;border-radius:20px;
background:#222;color:white;
}

.toggle-tab{
position:fixed;top:20px;right:0;
width:10px;height:40px;background:#ff0030;
}

.toggle-drawer{
position:fixed;top:20px;right:-120px;
width:120px;height:40px;background:#111;
display:flex;justify-content:space-around;align-items:center;
transition:.3s;
}
.toggle-drawer.open{right:0;}

#fab{
position:fixed;bottom:160px;right:20px;z-index:999;
}

#fab-main{
width:60px;height:60px;background:#ff0030;border-radius:50%;
display:flex;align-items:center;justify-content:center;
box-shadow:0 0 15px red;
cursor:pointer;
}

.fab-option{
width:50px;height:50px;background:#111;border-radius:50%;
display:flex;align-items:center;justify-content:center;
position:absolute;right:5px;
opacity:0;transform:scale(0);
transition:.3s;
}

#fab.open .fab-option:nth-child(2){bottom:70px;opacity:1;transform:scale(1);}
#fab.open .fab-option:nth-child(3){bottom:130px;opacity:1;transform:scale(1);}
#fab.open .fab-option:nth-child(4){bottom:190px;opacity:1;transform:scale(1);}
</style>
</head>

<body>

<div class="chat" id="chat"></div>

<div id="trading-box">

<h2>📊 Trading Dashboard</h2>

<button onclick="setSymbol('BTCUSDT')">BTC</button>
<button onclick="setSymbol('ETHUSDT')">ETH</button>
<button onclick="setSymbol('SOLUSDT')">SOL</button>

<div id="chart" style="height:250px;"></div>

<button onclick="getTrade()">Check Market</button>
<button onclick="confirmTrade()">Execute Trade</button>
<button onclick="connectUpstox()">Connect Upstox</button>
<button onclick="loadPortfolio()">Portfolio</button>
<button onclick="loadAnalytics()">Analytics</button>

<div id="trade-result"></div>

</div>

<div class="mic-panel"><div class="mic" id="micBtn">🎤</div></div>

<div class="keyboard">
<input id="input">
<button onclick="sendMessage()">Send</button>
</div>

<div id="fab">
<div id="fab-main">⚙️</div>
<div class="fab-option" onclick="switchMode('chat')">💬</div>
<div class="fab-option" onclick="switchMode('trade')">📊</div>
<div class="fab-option" onclick="switchMode('music')">🎵</div>
</div>

<script>

// CHAT
const chat=document.getElementById("chat");

function addMessage(t,type){
let d=document.createElement("div");
d.className="bubble "+type;
d.innerText=t;
chat.appendChild(d);
}

async function sendMessage(){
let input=document.getElementById("input");
addMessage(input.value,"user");

let res=await fetch("/chat",{method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({message:input.value})});

let data=await res.json();
addMessage(data.reply,"bot");
input.value="";
}

// FLOAT SWITCH
function switchMode(mode){
chat.style.display = (mode==="chat")?"flex":"none";
document.getElementById("trading-box").style.display =
(mode==="trade")?"block":"none";
}

// TRADING
let currentSymbol="BTCUSDT";
let latestSignal=null;

function loadChart(s){
document.getElementById("chart").innerHTML="";
new TradingView.widget({
container_id:"chart",
symbol:"BINANCE:"+s,
interval:"5",
theme:"dark",
autosize:true
});
}

function setSymbol(s){
currentSymbol=s;
loadChart(s);
}

async function getTrade(){
let res=await fetch("/ror-trade?symbol="+currentSymbol);
let data=await res.json();
latestSignal=data.analysis;

document.getElementById("trade-result").innerText =
JSON.stringify(data,null,2);
}

// AUTO POSITION SIZE
function calculateQty(balance,risk,entry,sl){
let riskAmount = balance * (risk/100);
let perUnitRisk = Math.abs(entry-sl);
return Math.max(1, Math.floor(riskAmount/perUnitRisk));
}

// EXECUTE
async function confirmTrade(){

if(!latestSignal){alert("No signal");return;}

let balance = 10000; // replace later from API
let qty = calculateQty(balance,1,latestSignal.entry,latestSignal.sl);

if(!confirm("Trade "+latestSignal.decision+" Qty:"+qty)) return;

let res=await fetch("/execute-order",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
qty:qty,
price:latestSignal.entry,
type:latestSignal.decision,
instrument:"NSE_EQ|INE002A01018"
})
});

alert("Order Sent");
}

// PORTFOLIO
async function loadPortfolio(){
let res=await fetch("/portfolio");
let data=await res.json();
document.getElementById("trade-result").innerText =
JSON.stringify(data,null,2);
}

// ANALYTICS
async function loadAnalytics(){
let res=await fetch("/analytics");
let data=await res.json();
document.getElementById("trade-result").innerText =
JSON.stringify(data,null,2);
}

// INIT
loadChart(currentSymbol);

</script>

</body>
</html>
