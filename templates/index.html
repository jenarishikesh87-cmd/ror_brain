<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROR Pro</title>

<script src="https://s3.tradingview.com/tv.js"></script>

<style>
body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:system-ui;
}

.card{
  background:#111;
  margin:10px;
  padding:12px;
  border-radius:12px;
}

button{
  background:#ff004c;
  border:none;
  color:#fff;
  padding:8px 12px;
  border-radius:8px;
  margin:3px;
}

.BUY{background:#00ff8840;}
.SELL{background:#ff003040;}
.HOLD{background:#88888840;}

#chart{
  height:300px;
}
</style>
</head>

<body>

<h3 style="padding:10px;">ROR Trading</h3>

<!-- ASSETS -->
<div style="padding:10px;">
<button onclick="setAsset('bitcoin','BINANCE:BTCUSDT')">BTC</button>
<button onclick="setAsset('ethereum','BINANCE:ETHUSDT')">ETH</button>
<button onclick="setAsset('solana','BINANCE:SOLUSDT')">SOL</button>
<button onclick="setAsset('AAPL','NASDAQ:AAPL')">AAPL</button>
<button onclick="setAsset('RELIANCE','NSE:RELIANCE')">RELIANCE</button>
</div>

<!-- CHART -->
<div id="chart"></div>

<!-- TRADE -->
<div class="card" id="trade"></div>

<!-- ACTION -->
<div style="padding:10px;">
<button onclick="getTrade()">Check Market</button>
<button onclick="confirmTrade()">Confirm Trade</button>
</div>

<script>

let currentAsset = "bitcoin";
let tvSymbol = "BINANCE:BTCUSDT";
let latestSignal = null;
let widget = null;

// -------- CHART INIT --------
function loadChart(){
  document.getElementById("chart").innerHTML = "";

  widget = new TradingView.widget({
    autosize: true,
    symbol: tvSymbol,
    interval: "5",
    timezone: "Asia/Kolkata",
    theme: "dark",
    style: "1",
    container_id: "chart"
  });
}

// -------- SET ASSET --------
function setAsset(asset, symbol){
  currentAsset = asset;
  tvSymbol = symbol;
  loadChart();
}

// -------- FETCH TRADE --------
async function getTrade(){
  const res = await fetch(`/ror-trade/${currentAsset}`);
  const data = await res.json();

  const a = data.analysis;
  latestSignal = a;

  document.getElementById("trade").innerHTML = `
<div>Price: $${data.price}</div>
<div class="${a.decision}">${a.decision}</div>

<div>Entry: ${a.entry}</div>
<div>TP: ${a.tp}</div>
<div>SL: ${a.sl}</div>

<div>${a.signals.join(", ")}</div>
<div>${a.reason}</div>

<button onclick="drawZones(${a.entry},${a.tp},${a.sl})">
📍 Show Zones
</button>
  `;
}

// -------- DRAW ZONES --------
function drawZones(entry,tp,sl){

  alert(`
ENTRY: ${entry}
TP: ${tp}
SL: ${sl}

(Visual zones shown conceptually)
  `);

  // Real overlay needs TradingView advanced API (optional upgrade)
}

// -------- AUTO TOKEN DETECTION --------
async function confirmTrade(){

  if(!latestSignal){
    alert("No signal");
    return;
  }

  // auto instrument mapping
  const instrumentMap = {
    "RELIANCE":"NSE_EQ|INE002A01018",
    "AAPL":"US_EQ|AAPL"
  };

  const instrument = instrumentMap[currentAsset.toUpperCase()];

  if(!instrument){
    alert("Instrument not supported yet");
    return;
  }

  if(!confirm(`Execute ${latestSignal.decision} ${currentAsset}?`)) return;

  const res = await fetch("/execute-order",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      qty:1,
      price:latestSignal.entry,
      type:latestSignal.decision,
      instrument:instrument
    })
  });

  const data = await res.json();
  alert("Order placed: " + JSON.stringify(data));
}

// INIT
loadChart();

</script>

</body>
  </html>
