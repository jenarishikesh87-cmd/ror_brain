<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROR</title>

<link rel="stylesheet" href="/static/style.css">

<style>
/* FLOATING BUBBLE */
.floating-container{
  position: fixed;
  bottom: 100px;
  right: 20px;
  z-index: 999;
}

.main-bubble{
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: #ff0033;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:22px;
  color:white;
  cursor:pointer;
  box-shadow:0 0 20px red;
}

.child{
  width:50px;
  height:50px;
  border-radius:50%;
  background:#111;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  margin-top:10px;
  opacity:0;
  transform:scale(0);
  transition:.3s;
}

.floating-container.active .child{
  opacity:1;
  transform:scale(1);
}
</style>
</head>

<body>

<!-- LOGO -->
<img src="{{ url_for('static', filename='ror-logo.png') }}" class="logo" id="logo">

<!-- TOGGLE -->
<div class="toggle-tab" id="toggleTab"></div>

<div class="toggle-drawer" id="toggleDrawer">
  <button onclick="setMicMode()">🎤</button>
  <button onclick="setKeyboardMode()">⌨️</button>
</div>

<!-- CHAT -->
<div class="chat" id="chat"></div>

<!-- TRADING -->
<div id="trading-box">
  <button id="trade-btn">📊 Check Market</button>
  <div id="trade-result"></div>
</div>

<!-- MIC PANEL -->
<div class="mic-panel" id="micPanel">
  <canvas id="blobCanvas"></canvas>
  <div class="mic" id="micBtn">🎤</div>
</div>

<!-- KEYBOARD -->
<div class="keyboard" id="keyboard">
  <input type="text" id="input">
  <button onclick="sendMessage()">Send</button>
</div>

<!-- FLOATING SWITCH -->
<div class="floating-container" id="floatMenu">
  <div class="main-bubble" onclick="toggleMenu()">⚙️</div>
  <div class="child" onclick="showChat()">💬</div>
  <div class="child" onclick="showTrading()">📈</div>
</div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const micBtn = document.getElementById("micBtn");
const micPanel = document.getElementById("micPanel");
const keyboard = document.getElementById("keyboard");
const toggleTab = document.getElementById("toggleTab");
const toggleDrawer = document.getElementById("toggleDrawer");
const tradeBtn = document.getElementById("trade-btn");
const tradeResult = document.getElementById("trade-result");

let listening=false;

/* TOGGLE */
toggleTab.onclick=()=>toggleDrawer.classList.toggle("open");

function setMicMode(){
  micPanel.style.display="flex";
  keyboard.style.display="none";
  toggleDrawer.classList.remove("open");
}

function setKeyboardMode(){
  micPanel.style.display="none";
  keyboard.style.display="flex";
  toggleDrawer.classList.remove("open");
}

/* CHAT */
function addMessage(text,type){
  const div=document.createElement("div");
  div.className="bubble "+type;
  div.innerText=text;
  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;
}

async function sendMessage(){
  if(!input.value.trim()) return;
  addMessage(input.value,"user");

  const res=await fetch("/chat",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({message:input.value})
  });

  const data=await res.json();
  addMessage(data.reply,"bot");
  input.value="";
}

/* MIC */
micBtn.onclick=()=>{
  if(!('webkitSpeechRecognition' in window)) return;

  const rec=new webkitSpeechRecognition();
  rec.start();

  rec.onresult=(e)=>{
    const text=e.results[0][0].transcript;
    addMessage(text,"user");
    sendVoice(text);
  }
}

function sendVoice(text){
  fetch("/chat",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({message:text})
  })
  .then(res=>res.json())
  .then(d=>addMessage(d.reply,"bot"));
}

/* TRADING */
tradeBtn.onclick=async()=>{
  tradeResult.innerText="Loading...";
  const res=await fetch("/ror-trade");
  const data=await res.json();

  tradeResult.innerText=
  "Price: "+data.price+
  "\nDecision: "+data.analysis.decision+
  "\nConfidence: "+data.analysis.confidence+"%"+
  "\nReason: "+data.analysis.reason;
}

/* FLOAT MENU */
function toggleMenu(){
  document.getElementById("floatMenu").classList.toggle("active");
}

function showChat(){
  document.getElementById("trading-box").style.display="none";
  chat.style.display="flex";
}

function showTrading(){
  document.getElementById("trading-box").style.display="block";
  chat.style.display="none";
}
</script>

</body>
</html>
